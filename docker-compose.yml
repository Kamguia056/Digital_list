version: '3.9'

services:
  # ── Flutter CI Build ───────────────────────────────────────
  flutter-test:
    build:
      context: .
      target: test
    container_name: digitallist_test
    volumes:
      - ./coverage:/app/coverage
    command: flutter test --coverage --reporter=json > coverage/test_results.json

  # ── Firebase Emulator Suite ────────────────────────────────
  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    container_name: digitallist_firebase_emulator
    ports:
      - "4000:4000"   # Emulator UI
      - "8080:8080"   # Firestore
      - "9099:9099"   # Authentication
      - "9199:9199"   # Storage
      - "5001:5001"   # Functions
    volumes:
      - ./firebase.json:/home/node/firebase.json
      - ./firestore.rules:/home/node/firestore.rules
      - ./.firebaserc:/home/node/.firebaserc
    command: firebase emulators:start --only firestore,auth,storage
    environment:
      - FIREBASE_TOKEN=${FIREBASE_TOKEN}

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: digitallist_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.1
    container_name: digitallist_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── Node Exporter (system metrics) ────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: digitallist_node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: digitallist_network
