apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digitallist-ingress
  namespace: digitallist
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.digitallist.app
      secretName: digitallist-tls
  rules:
    - host: api.digitallist.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digitallist-service
                port:
                  number: 80
