apiVersion: apps/v1
kind: Deployment
metadata:
  name: digitallist-api
  namespace: digitallist
  labels:
    app: digitallist
    tier: backend
    version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: digitallist
      tier: backend
  template:
    metadata:
      labels:
        app: digitallist
        tier: backend
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: digitallist-api
          image: digitallist/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: digitallist-config
                  key: FIREBASE_PROJECT_ID
            - name: FIREBASE_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: digitallist-secrets
                  key: FIREBASE_CREDENTIALS
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
      restartPolicy: Always
