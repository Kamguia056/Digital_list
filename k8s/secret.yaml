apiVersion: v1
kind: Secret
metadata:
  name: digitallist-secrets
  namespace: digitallist
type: Opaque
stringData:
  # Base64-encoded Firebase service account JSON
  FIREBASE_CREDENTIALS: "<BASE64_ENCODED_FIREBASE_SERVICE_ACCOUNT_JSON>"
  # Docker registry credentials
  DOCKER_REGISTRY_TOKEN: "<DOCKER_REGISTRY_TOKEN>"
  # Grafana admin password
  GRAFANA_ADMIN_PASSWORD: "<GRAFANA_ADMIN_PASSWORD>"
---
# IMPORTANT: Ne jamais versionner ce fichier avec de vraies valeurs.
# Utilisez: kubectl create secret generic digitallist-secrets \
#   --from-file=FIREBASE_CREDENTIALS=./firebase-service-account.json \
#   --namespace=digitallist
