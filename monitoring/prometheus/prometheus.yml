global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: 'digitallist'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Application API metrics
  - job_name: 'digitallist-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['digitallist-service:9090']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'digitallist-api'

  # Firebase metrics (via custom exporter)
  - job_name: 'firebase-exporter'
    scrape_interval: 60s
    static_configs:
      - targets: ['firebase-exporter:9373']

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
