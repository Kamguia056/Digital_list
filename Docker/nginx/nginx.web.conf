# ============================================================
# Digital List — Configuration NGINX pour Flutter Web
# Fichier : docker/nginx/nginx.web.conf
# Description : Sert l'application Flutter Web avec :
#   - Gestion du routing SPA (Single Page Application)
#   - Compression Gzip pour les performances
#   - Headers de sécurité
#   - Cache des assets statiques
#   - Support des Service Workers (PWA)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Répertoire racine des fichiers Flutter Web
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression Gzip ────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ── Headers de Sécurité ─────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

    # ── Cache des assets Flutter (JS, WASM, fonts) ──────────
    # Ces fichiers sont hachés par Flutter — cache long terme
    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Service Worker Flutter (PWA) ────────────────────────
    # Pas de cache pour le SW — doit toujours être frais
    location = /flutter_service_worker.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # ── Health Check endpoint ────────────────────────────────
    # Utilisé par Kubernetes liveness/readiness probes
    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"digitallist-app"}';
        add_header Content-Type application/json;
    }

    # ── Routing SPA Flutter Web ─────────────────────────────
    # Toutes les routes non trouvées → index.html
    # (Flutter Router gère le routing côté client)
    location / {
        try_files $uri $uri/ /index.html;

        # Pas de cache pour index.html (point d'entrée SPA)
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Logs ────────────────────────────────────────────────
    access_log /var/log/nginx/digitallist_access.log combined;
    error_log  /var/log/nginx/digitallist_error.log warn;

    # ── Taille max des uploads (export PDF côté client) ─────
    client_max_body_size 10M;
}
